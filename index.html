<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>겹</title>
  <meta name="description" content="벽지를 한 겹 뜯을 때마다, 방이 그 시절로 돌아간다.">
  <meta name="theme-color" content="#0e0e11">
  <meta name="color-scheme" content="dark">

  <!-- 아이폰 홈 화면 웹앱 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="겹">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <div id="stage">
      <header id="top">
        <span id="clock"></span>
        <span id="place"></span>
      </header>

      <main id="scene">
        <div id="layers"></div>
        <div id="flash"></div>
        <button class="turn left" data-dir="-1" aria-label="왼쪽 벽으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="turn right" data-dir="1" aria-label="오른쪽 벽으로"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </main>

      <div id="caption-band"><p id="caption" aria-live="polite"></p></div>

      <section id="bag">
        <div id="slots"></div>
        <div id="item-name"></div>
      </section>

      <div id="puzzle" class="overlay" hidden></div>

      <div id="contract" class="overlay" hidden></div>
      <div id="ending" class="ending" hidden></div>

      <div id="card" class="overlay" hidden>
        <div class="card-box">
          <button class="close" aria-label="닫기">✕</button>
          <div class="card-art"></div>
          <h2 class="card-title"></h2>
          <p class="card-text"></p>
          <p class="card-more"></p>
        </div>
      </div>
    </div>
  </div>

  <div id="rotate-msg">
    <svg viewBox="0 0 48 48"><rect x="15" y="6" width="18" height="36" rx="3"/><path d="M8 30a16 16 0 0 0 10 12M40 18A16 16 0 0 0 30 6"/></svg>
    <p>세로로 돌려주세요</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
